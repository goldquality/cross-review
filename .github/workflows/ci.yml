name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Интерфейс клиента — Wails. На Linux без тега purego он собирается с cgo и требует заголовки GTK
    # и WebKitGTK; с тегом — грузит их только при запуске, а тестам они не нужны.
    env:
      GOFLAGS: ${{ matrix.os == 'ubuntu-latest' && '-tags=purego' || '' }}
    steps:
      # Actions закреплены по SHA: тег можно переставить, коммит — нет. Обновляет Dependabot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
