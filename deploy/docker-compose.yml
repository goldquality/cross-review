# Брокер за Caddy с автоматическим HTTPS.
#   DOMAIN=review.example.com docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml logs broker   # приглашение при первом старте
#   docker compose -f deploy/docker-compose.yml exec broker broker members
services:
  broker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      BROKER_PUBLIC_URL: https://${DOMAIN:?укажи DOMAIN}
      BROKER_TRUST_PROXY: "1"
    volumes:
      - broker-data:/data
    expose:
      - "8080"
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - broker
volumes:
  broker-data:
  caddy-data:
