# Окна клиента на трёх ОС: `cross-review selftest-ui` показывает уведомление и вопрос о задании и
# проверяет, что панель тостов встала в правый верхний угол, не забрала фокус у окна, где человек
# печатает, и что страница говорит с Go. Код 1 — проблема; скриншот — в артефактах задачи.
name: ui
on:
  push:
    paths:
      - "cmd/cross-review/**"
      - "internal/client/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ui.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Как в релизе: без cgo, кросс-компиляцией. Для Windows — ещё консольная сборка: у windowsgui
      # нет stdout, куда печатается отчёт.
      - name: build
        run: |
          set -eu
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -tags production,purego -trimpath -ldflags="-s -w" -o dist/linux-$arch ./cmd/cross-review
          done
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags production -trimpath -ldflags="-s -w" -o dist/windows-amd64-console.exe ./cmd/cross-review
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin
          path: dist

  linux:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin
          path: dist
      # Библиотеки, которые нужны участнику, и Xvfb с mutter (оконный менеджер GNOME) для прогона.
      # Запрет AppArmor на пространства имён не снимаем: клиент сам выключает песочницу WebKit,
      # когда она не может запуститься, — это тоже проверка.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-1 libwebkitgtk-6.0-4 xvfb imagemagick dbus-x11 at-spi2-core mutter xterm
      # xterm запускается после клиента — это окно, где человек печатает; тосты — через 6 с.
      - name: selftest-ui
        run: |
          chmod +x dist/linux-${{ matrix.arch }}
          code=0
          dbus-run-session -- xvfb-run -a -s "-screen 0 1440x900x24" sh -c '
            mutter --x11 --replace --sm-disable > mutter.log 2>&1 &
            sleep 3
            ./dist/linux-${{ matrix.arch }} selftest-ui -delay 6s -exit 18s > report.txt 2>&1 & P=$!
            sleep 2; xterm -geometry 100x30+100+200 & sleep 10
            import -window root shot.png || true
            wait $P' || code=$?
          cat report.txt
          sed -n "/^REPORT/,\$p" report.txt | sed "s/^REPORT //" | (echo '```json'; cat; echo '```') >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            report.txt
            shot.png

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin
          path: dist
      # Блокнот запускается после клиента — это окно, где человек печатает; тосты — через 6 с.
      - name: selftest-ui
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\windows-amd64-console.exe -ArgumentList 'selftest-ui','-delay','6s','-exit','18s' `
            -RedirectStandardOutput report.txt -RedirectStandardError err.txt -PassThru -NoNewWindow
          $null = $p.Handle
          Start-Sleep 2
          Start-Process notepad
          Start-Sleep 10
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("shot.png")
          $p.WaitForExit()
          Get-Content report.txt
          Get-Content err.txt | Select-Object -Last 30
          $json = (Get-Content report.txt -Raw) -replace '(?s)^.*?REPORT ', ''
          "``````json`n$json`n``````" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit $p.ExitCode
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            report.txt
            err.txt
            shot.png

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=1 go build -tags production -trimpath -ldflags="-s -w" -o cross-review ./cmd/cross-review
      - name: selftest-ui
        run: |
          ./cross-review selftest-ui -delay 3s -exit 12s > report.txt 2>&1 & P=$!
          sleep 8; screencapture -x shot.png || true
          code=0; wait $P || code=$?
          cat report.txt
          sed -n "/^REPORT/,\$p" report.txt | sed "s/^REPORT //" | (echo '```json'; cat; echo '```') >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            report.txt
            shot.png
