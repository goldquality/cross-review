# Релиз по тегу v*: клиент под macOS, Linux, Windows и образ брокера в ghcr.io.
#
# Права выданы каждой задаче отдельно: сборка только читает репо, публикует релиз одна задача,
# пишет в ghcr другая. Actions закреплены по SHA, обновляет их Dependabot. К файлам релиза
# прилагаются SHA256SUMS и подпись происхождения (gh attestation verify).
name: release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  darwin:
    # Трей на macOS — Cocoa через cgo, поэтому собираем на маке.
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: build
        run: |
          mkdir -p dist
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/cross-review-$arch ./cmd/cross-review
          done
          lipo -create -output dist/cross-review dist/cross-review-arm64 dist/cross-review-amd64
          cd dist && zip -q cross-review-macos.zip cross-review
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin
          path: dist/cross-review-macos.zip
  others:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: build
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/cross-review ./cmd/cross-review
            tar -C dist -czf dist/cross-review-linux-$arch.tar.gz cross-review && rm dist/cross-review
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -trimpath -ldflags="-s -w -H=windowsgui -X main.version=${GITHUB_REF_NAME}" -o dist/cross-review.exe ./cmd/cross-review
            (cd dist && zip -q cross-review-windows-$arch.zip cross-review.exe && rm cross-review.exe)
          done
          # compose брокера — файлом релиза: быстрый старт качает его без клона репо
          cp deploy/docker-compose.yml dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: others
          path: dist/*
  publish:
    needs: [darwin, others]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
  broker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # sha-<коммит> — неизменяемый тег для деплоя, который принимает только такие теги
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          build-args: VERSION=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cross-review-broker:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/cross-review-broker:latest
            ghcr.io/${{ github.repository_owner }}/cross-review-broker:sha-${{ steps.sha.outputs.short }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cross-review-broker
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
