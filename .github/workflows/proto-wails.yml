# Прототип интерфейса на Wails (proto/wails-ui, шаг 0 плана): собирается ли всё без cgo на одном
# раннере, как сейчас релиз, и как окно у трея и тосты ведут себя на каждой ОС. Каждый прогон
# печатает отчёт (REPORT), выходит с кодом 1, если нашёл проблему, и оставляет скриншот.
name: proto-wails
on:
  push:
    branches: [wails-ui]
    paths: ["proto/wails-ui/**", ".github/workflows/proto-wails.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: proto/wails-ui/go.mod
          cache-dependency-path: proto/wails-ui/go.sum
      - name: строки брокера — только textContent
        run: "! grep -rnE 'innerHTML|outerHTML|insertAdjacentHTML|document\\.write' proto/wails-ui/assets"
      - name: vet
        working-directory: proto/wails-ui
        # без cgo под каждую ОС: обычный go vet на ubuntu собрал бы Linux-бэкенд с cgo и потребовал GTK
        run: |
          CGO_ENABLED=0 GOOS=linux go vet -tags purego ./...
          CGO_ENABLED=0 GOOS=darwin go vet -tags purego ./...
          CGO_ENABLED=0 GOOS=windows go vet ./...
      - name: build без cgo, кросс-компиляцией
        working-directory: proto/wails-ui
        run: |
          set -eu
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -tags production,purego -trimpath -ldflags="-s -w" -o dist/linux-$arch .
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -tags production,purego -trimpath -ldflags="-s -w" -o dist/darwin-$arch-purego .
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -tags production -trimpath -ldflags="-s -w -H=windowsgui" -o dist/windows-$arch.exe .
            # консольный вариант — для прогона в CI: у windowsgui нет stdout для отчёта
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -tags production -trimpath -ldflags="-s -w" -o dist/windows-$arch-console.exe .
          done
          {
            echo "| файл | МБ |"; echo "|---|---|"
            for f in dist/*; do printf '| %s | %.1f |\n' "${f#dist/}" "$(echo "$(stat -c %s "$f") / 1048576" | bc -l)"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proto-bin
          path: proto/wails-ui/dist

  linux:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64, variant: purego }
          - { runner: ubuntu-24.04-arm, arch: arm64, variant: purego }
          - { runner: ubuntu-24.04, arch: amd64, variant: cgo }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proto-bin
          path: dist
      - name: библиотеки, которые нужны участнику (и Xvfb для прогона)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-1 libwebkitgtk-6.0-4 xvfb imagemagick dbus-x11 at-spi2-core
      # Песочница WebKitGTK (bwrap) создаёт пространство имён пользователя, а Ubuntu 24.04 запрещает
      # это через AppArmor: без снятия запрета WebKit падает с «bwrap: setting up uid map:
      # Permission denied» — и с cgo, и без. Как это на десктопе участника — проверить отдельно.
      - name: разрешить песочницу WebKit на раннере
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: matrix.variant == 'cgo'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src
      - if: matrix.variant == 'cgo'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: src/proto/wails-ui/go.mod
          cache-dependency-path: src/proto/wails-ui/go.sum
      - if: matrix.variant == 'cgo'
        name: сборка с cgo
        run: |
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
          (cd src/proto/wails-ui && go build -tags production -trimpath -ldflags="-s -w" -o ../../../dist/linux-${{ matrix.arch }} .)
          ls -l dist/linux-${{ matrix.arch }}
      - name: демо под Xvfb
        run: |
          chmod +x dist/linux-${{ matrix.arch }}
          code=0
          dbus-run-session -- xvfb-run -a -s "-screen 0 1440x900x24" sh -c '
            ./dist/linux-${{ matrix.arch }} -demo -hostile -exit 15s > report.txt 2>&1 & P=$!
            sleep 9; import -window root shot.png || true
            wait $P' || code=$?
          cat report.txt
          sed -n "/^REPORT/,\$p" report.txt | sed "s/^REPORT //" | (echo '```json'; cat; echo '```') >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}-${{ matrix.variant }}
          path: |
            report.txt
            shot.png

  windows:
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # na — тост показывается через SW_SHOWNOACTIVATE (так задумано); wails — только Show() Wails,
        # для сравнения: заберёт ли он фокус у Блокнота.
        show: [na, wails]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proto-bin
          path: dist
      # Как в жизни: прототип в фоне, человек печатает в Блокноте, приходят тосты. Блокнот запускается
      # после прототипа, окна с данными нет (-popover=false), тосты — через 6 с. В отчёте видно, чьё
      # окно активно и не забрал ли тост фокус.
      - name: демо поверх Блокнота
        shell: pwsh
        run: |
          $env:PROTO_WIN_SHOW = '${{ matrix.show }}'
          $p = Start-Process -FilePath dist\windows-amd64-console.exe `
            -ArgumentList '-demo','-hostile','-popover=false','-delay','6s','-exit','20s' `
            -RedirectStandardOutput report.txt -RedirectStandardError err.txt -PassThru -NoNewWindow
          $null = $p.Handle
          Start-Sleep 2
          Start-Process notepad
          Start-Sleep 10
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("shot.png")
          $p.WaitForExit()
          Get-Content report.txt
          Get-Content err.txt | Select-Object -Last 30
          $json = (Get-Content report.txt -Raw) -replace '(?s)^.*?REPORT ', ''
          "``````json`n$json`n``````" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit $p.ExitCode
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.show }}
          path: |
            report.txt
            err.txt
            shot.png

  macos:
    needs: build
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [purego, cgo]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proto-bin
          path: dist
      - if: matrix.variant == 'cgo'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src
      - if: matrix.variant == 'cgo'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: src/proto/wails-ui/go.mod
          cache-dependency-path: src/proto/wails-ui/go.sum
      - if: matrix.variant == 'cgo'
        run: (cd src/proto/wails-ui && CGO_ENABLED=1 go build -tags production -trimpath -ldflags="-s -w" -o ../../../dist/darwin-arm64-cgo .)
      - name: демо
        run: |
          bin=dist/darwin-arm64-${{ matrix.variant }}
          chmod +x $bin
          $bin -demo -hostile -exit 15s > report.txt 2>&1 & P=$!
          sleep 9; screencapture -x shot.png || true
          code=0; wait $P || code=$?
          cat report.txt
          sed -n "/^REPORT/,\$p" report.txt | sed "s/^REPORT //" | (echo '```json'; cat; echo '```') >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.variant }}
          path: |
            report.txt
            shot.png
